name: Weekly Meta Ad Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Scrape latest ads
        run: python scripts/scrape_meta_ads.py

      - name: Commit refreshed data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta_ads_latest.csv data/run_metadata.json
          git diff --staged --quiet || git commit -m "chore: weekly meta ads data refresh"

      - name: Push changes
        run: git push

      - name: Upload data artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: meta-ads-data
          path: data/
